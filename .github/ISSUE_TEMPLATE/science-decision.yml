name: Science decision
description: An agent is blocked because spec/ does not state a convention, tolerance, or constant.
title: "science: "
labels: ["needs-science-decision"]
body:
  - type: textarea
    id: spec_line
    attributes:
      label: Spec line
      description: Quote the exact spec line. If the line is missing, name the heading that should hold it.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: Concrete options. Do not pick one.
    validations:
      required: true
  - type: textarea
    id: blocked
    attributes:
      label: Work stopped
      description: What you stopped doing until the owner decides.
    validations:
      required: true
