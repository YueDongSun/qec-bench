[project]
name = "qecbench"
version = "0.0.1"
description = "Execution-graded agent benchmark for quantum error correction and error mitigation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Yuedong Sun" }]
dependencies = [
    "stim==1.16.0",
    "pymatching==2.4.0",
    "mitiq==1.1.0",
    # mitiq requires cirq-core as its frontend. qiskit is not a mitiq core dependency and is not pinned.
    "cirq-core==1.6.1",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "nbstripout==0.9.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL"]

[tool.ruff.lint.isort]
known-first-party = ["qecbench", "tools"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: runs a task solution and the empty-solution check",
]
